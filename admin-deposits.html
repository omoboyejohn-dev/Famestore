<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Deposit Management | Fame Store</title>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #f7f8fb;
            color: #172033;
            font-family: "DM Sans", sans-serif;
        }

        button {
            font-family: inherit;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .admin-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #fff;
            border-bottom: 1px solid #e8ebef;
        }

        .header-inner {
            width: min(1200px, 94%);
            min-height: 72px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            border-radius: 11px;
            background: #fff0f5;
            font-size: 21px;
        }

        .brand strong {
            display: block;
            font-size: 18px;
            font-weight: 800;
        }

        .brand strong span {
            color: #ed1761;
        }

        .brand small {
            color: #94a3b8;
            font-size: 9px;
        }

        .admin-user {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .admin-email {
            color: #64748b;
            font-size: 11px;
        }

        .logout-button {
            padding: 9px 14px;
            border: 1px solid #e1e6eb;
            border-radius: 8px;
            background: #fff;
            color: #475569;
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
        }

        .logout-button:hover {
            border-color: #ed1761;
            color: #ed1761;
        }

        .admin-main {
            width: min(1200px, 94%);
            margin: auto;
            padding: 38px 0 70px;
        }

        .page-heading {
            margin-bottom: 28px;
        }

        .back {
            display: inline-block;
            margin-bottom: 15px;
            color: #ed1761;
            font-size: 11px;
            font-weight: 800;
        }

        .page-heading span {
            color: #ed1761;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1.5px;
        }

        .page-heading h1 {
            margin: 7px 0;
            font-size: 29px;
        }

        .page-heading p {
            color: #64748b;
            font-size: 12px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 25px;
        }

        .stat-card {
            padding: 20px;
            background: #fff;
            border: 1px solid #e7ebef;
            border-radius: 15px;
        }

        .stat-title {
            color: #64748b;
            font-size: 10px;
            font-weight: 700;
        }

        .stat-value {
            margin-top: 10px;
            font-size: 23px;
            font-weight: 800;
        }

        .section-card {
            background: #fff;
            border: 1px solid #e7ebef;
            border-radius: 15px;
            overflow: hidden;
        }

        .section-header {
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #edf0f3;
        }

        .section-header h2 {
            font-size: 16px;
        }

        .section-header p {
            margin-top: 4px;
            color: #94a3b8;
            font-size: 10px;
        }

        .refresh-button {
            padding: 9px 13px;
            border: none;
            border-radius: 8px;
            background: #ed1761;
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            cursor: pointer;
        }

        .refresh-button:hover {
            background: #d90d53;
        }

        .deposit-list {
            padding: 5px 20px 20px;
        }

        .deposit-card {
            margin: 15px 0;
            padding: 20px;
            border: 1px solid #edf0f3;
            border-radius: 12px;
            background: #fff;
        }

        .deposit-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 15px;
        }

        .customer-label {
            color: #94a3b8;
            font-size: 9px;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: .7px;
        }

        .customer-email {
            margin-top: 4px;
            font-size: 13px;
            font-weight: 800;
        }

        .status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 8px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .status.pending {
            background: #fff7df;
            color: #9a6b00;
        }

        .status.approved {
            background: #eaf8ef;
            color: #16803d;
        }

        .status.rejected {
            background: #fff0f1;
            color: #c52d3c;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid #f0f2f5;
        }

        .detail-label {
            display: block;
            color: #94a3b8;
            font-size: 9px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .detail-value {
            font-size: 11px;
            font-weight: 700;
            word-break: break-word;
        }

        .amount {
            font-size: 15px;
            color: #172033;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            padding-top: 17px;
            border-top: 1px solid #f0f2f5;
        }

        .approve-button,
        .reject-button {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            font-size: 10px;
            font-weight: 800;
        }

        .approve-button {
            background: #16803d;
        }

        .approve-button:hover {
            background: #116b32;
        }

        .reject-button {
            background: #c52d3c;
        }

        .reject-button:hover {
            background: #a92331;
        }

        button:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        .loading,
        .empty-state {
            padding: 45px 15px;
            text-align: center;
            color: #94a3b8;
            font-size: 11px;
        }

        .error-box {
            display: none;
            margin-bottom: 20px;
            padding: 13px 15px;
            border-radius: 9px;
            background: #fff1f2;
            color: #be123c;
            font-size: 11px;
        }

        .success-box {
            display: none;
            margin-bottom: 20px;
            padding: 13px 15px;
            border-radius: 9px;
            background: #eaf8ef;
            color: #16803d;
            font-size: 11px;
        }

        @media (max-width: 700px) {

            .admin-email {
                display: none;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .details {
                grid-template-columns: 1fr;
            }

            .deposit-top {
                flex-direction: column;
            }

            .actions {
                flex-direction: column;
            }

            .approve-button,
            .reject-button {
                width: 100%;
            }

            .admin-main {
                padding-top: 28px;
            }

            .page-heading h1 {
                font-size: 25px;
            }

        }

    </style>

</head>

<body>

<header class="admin-header">

    <div class="header-inner">

        <a href="dashboard.html" class="brand">

            <div class="brand-icon">
                🛍️
            </div>

            <div>

                <strong>
                    Fame <span>Store</span>
                </strong>

                <small>
                    ADMINISTRATION
                </small>

            </div>

        </a>

        <div class="admin-user">

            <span
                id="adminEmail"
                class="admin-email"
            >
                Loading...
            </span>

            <button
                type="button"
                id="logoutButton"
                class="logout-button"
            >
                Logout
            </button>

        </div>

    </div>

</header>


<main class="admin-main">

    <div class="page-heading">

        <a
            href="dashboard.html"
            class="back"
        >
            ← Back to Dashboard
        </a>

        <span>
            ADMIN PANEL
        </span>

        <h1>
            Deposit Management
        </h1>

        <p>
            Review customer deposit payment requests.
        </p>

    </div>


    <div
        id="errorBox"
        class="error-box"
    ></div>


    <div
        id="successBox"
        class="success-box"
    ></div>


    <section class="stats-grid">

        <div class="stat-card">

            <div class="stat-title">
                PENDING DEPOSITS
            </div>

            <div
                id="pendingCount"
                class="stat-value"
            >
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-title">
                APPROVED DEPOSITS
            </div>

            <div
                id="approvedCount"
                class="stat-value"
            >
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-title">
                PENDING AMOUNT
            </div>

            <div
                id="pendingAmount"
                class="stat-value"
            >
                ₦0.00
            </div>

        </div>

    </section>


    <section class="section-card">

        <div class="section-header">

            <div>

                <h2>
                    Customer Deposit Requests
                </h2>

                <p>
                    Review and process customer payments
                </p>

            </div>

            <button
                type="button"
                id="refreshButton"
                class="refresh-button"
            >
                Refresh
            </button>

        </div>


        <div
            id="depositList"
            class="deposit-list"
        >

            <div class="loading">
                Loading deposits...
            </div>

        </div>

    </section>

</main>


<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


    import {
        getAuth,
        onAuthStateChanged,
        signOut
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


    import {
        getFirestore,
        collection,
        getDocs,
        doc,
        getDoc,
        updateDoc,
        runTransaction,
        increment
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


    const firebaseConfig = {

        apiKey:
            "AIzaSyCnANua92lDErdMwoKQG3xN4NtILIcyrsk",

        authDomain:
            "famestore-aaa70.firebaseapp.com",

        projectId:
            "famestore-aaa70",

        storageBucket:
            "famestore-aaa70.firebasestorage.app",

        messagingSenderId:
            "906739139078",

        appId:
            "1:906739139078:web:435561274e65d47eb33987",

        measurementId:
            "G-H2429058CT"

    };


    const app =
        initializeApp(firebaseConfig);


    const auth =
        getAuth(app);


    const db =
        getFirestore(app);


    const adminEmail =
        document.getElementById("adminEmail");


    const depositList =
        document.getElementById("depositList");


    const errorBox =
        document.getElementById("errorBox");


    const successBox =
        document.getElementById("successBox");


    function showError(message) {

        errorBox.textContent = message;
        errorBox.style.display = "block";

        successBox.style.display = "none";

    }


    function showSuccess(message) {

        successBox.textContent = message;
        successBox.style.display = "block";

        errorBox.style.display = "none";

    }


    function formatNaira(amount) {

        return new Intl.NumberFormat(
            "en-NG",
            {
                style: "currency",
                currency: "NGN"
            }
        ).format(
            Number(amount) || 0
        );

    }


    function escapeHTML(value) {

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    function formatDate(timestamp) {

        if (!timestamp) {
            return "Not available";
        }

        try {

            let date;

            if (
                typeof timestamp.toDate ===
                "function"
            ) {

                date =
                    timestamp.toDate();

            } else if (
                timestamp.seconds
            ) {

                date =
                    new Date(
                        timestamp.seconds * 1000
                    );

            } else {

                date =
                    new Date(timestamp);

            }

            return date.toLocaleString(
                "en-NG",
                {
                    day: "2-digit",
                    month: "short",
                    year: "numeric",
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

        } catch (error) {

            return "Not available";

        }

    }


    /*
     * ==================================================
     * AUTHENTICATION
     * ==================================================
     */

    onAuthStateChanged(
        auth,
        async (user) => {

            if (!user) {

                window.location.href =
                    "index.html";

                return;

            }

            adminEmail.textContent =
                user.email || "Admin";

            await loadDeposits();

        }
    );


    /*
     * ==================================================
     * LOAD DEPOSITS
     * ==================================================
     */

    async function loadDeposits() {

        depositList.innerHTML = `
            <div class="loading">
                Loading deposits...
            </div>
        `;

        errorBox.style.display = "none";
        successBox.style.display = "none";

        try {

            const snapshot =
                await getDocs(
                    collection(
                        db,
                        "deposits"
                    )
                );


            const deposits = [];


            snapshot.forEach(
                (depositDoc) => {

                    deposits.push({
                        id: depositDoc.id,
                        ...depositDoc.data()
                    });

                }
            );


            deposits.sort(
                (a, b) => {

                    const aTime =
                        a.createdAt?.seconds || 0;

                    const bTime =
                        b.createdAt?.seconds || 0;

                    return bTime - aTime;

                }
            );


            let pending = 0;
            let approved = 0;
            let pendingTotal = 0;


            deposits.forEach(
                (deposit) => {

                    if (
                        deposit.status ===
                        "pending"
                    ) {

                        pending++;

                        pendingTotal +=
                            Number(
                                deposit.amount
                            ) || 0;

                    }

                    if (
                        deposit.status ===
                        "approved"
                    ) {

                        approved++;

                    }

                }
            );


            document.getElementById(
                "pendingCount"
            ).textContent =
                pending;


            document.getElementById(
                "approvedCount"
            ).textContent =
                approved;


            document.getElementById(
                "pendingAmount"
            ).textContent =
                formatNaira(
                    pendingTotal
                );


            renderDeposits(
                deposits
            );

        } catch (error) {

            console.error(
                "Load deposits error:",
                error
            );

            showError(
                "Unable to load deposits. Check your Firestore security rules."
            );

            depositList.innerHTML = `
                <div class="empty-state">
                    Unable to load deposits.
                </div>
            `;

        }

    }


    /*
     * ==================================================
     * RENDER DEPOSITS
     * ==================================================
     */

    function renderDeposits(deposits) {

        if (!deposits.length) {

            depositList.innerHTML = `
                <div class="empty-state">
                    No customer deposits found.
                </div>
            `;

            return;

        }


        depositList.innerHTML =
            deposits.map(
                (deposit) => {

                    const status =
                        deposit.status ||
                        "pending";


                    const email =
                        deposit.customerEmail ||
                        "Customer";


                    const sender =
                        deposit.senderName ||
                        "Unknown sender";


                    const reference =
                        deposit.transactionReference ||
                        deposit.reference ||
                        "Not provided";


                    const uid =
                        deposit.customerUID ||
                        deposit.customerUid ||
                        deposit.userId ||
                        deposit.uid ||
                        "Not provided";


                    const amount =
                        formatNaira(
                            deposit.amount
                        );


                    const createdAt =
                        formatDate(
                            deposit.createdAt
                        );


                    const buttons =
                        status === "pending"
                            ? `
                                <div class="actions">

                                    <button
                                        type="button"
                                        class="approve-button"
                                        data-action="approve"
                                        data-id="${escapeHTML(deposit.id)}"
                                    >
                                        ✓ Approve
                                    </button>

                                    <button
                                        type="button"
                                        class="reject-button"
                                        data-action="reject"
                                        data-id="${escapeHTML(deposit.id)}"
                                    >
                                        ✕ Reject
                                    </button>

                                </div>
                            `
                            : "";


                    return `

                        <div class="deposit-card">

                            <div class="deposit-top">

                                <div>

                                    <div class="customer-label">
                                        Customer
                                    </div>

                                    <div class="customer-email">
                                        ${escapeHTML(email)}
                                    </div>

                                </div>

                                <span
                                    class="status ${escapeHTML(status)}"
                                >
                                    ${escapeHTML(status)}
                                </span>

                            </div>


                            <div class="details">

                                <div>

                                    <span class="detail-label">
                                        Deposit Amount
                                    </span>

                                    <span class="detail-value amount">
                                        ${amount}
                                    </span>

                                </div>


                                <div>

                                    <span class="detail-label">
                                        Sender Name
                                    </span>

                                    <span class="detail-value">
                                        ${escapeHTML(sender)}
                                    </span>

                                </div>


                                <div>

                                    <span class="detail-label">
                                        Transaction Reference
                                    </span>

                                    <span class="detail-value">
                                        ${escapeHTML(reference)}
                                    </span>

                                </div>


                                <div>

                                    <span class="detail-label">
                                        Submitted
                                    </span>

                                    <span class="detail-value">
                                        ${createdAt}
                                    </span>

                                </div>


                                <div>

                                    <span class="detail-label">
                                        Customer UID
                                    </span>

                                    <span class="detail-value">
                                        ${escapeHTML(uid)}
                                    </span>

                                </div>

                            </div>

                            ${buttons}

                        </div>

                    `;

                }
            ).join("");


        document
            .querySelectorAll(
                "[data-action]"
            )
            .forEach(
                (button) => {

                    button.addEventListener(
                        "click",
                        async () => {

                            const action =
                                button.dataset.action;

                            const id =
                                button.dataset.id;

                            if (
                                action ===
                                "approve"
                            ) {

                                await approveDeposit(
                                    id,
                                    button
                                );

                            }


                            if (
                                action ===
                                "reject"
                            ) {

                                await rejectDeposit(
                                    id,
                                    button
                                );

                            }

                        }
                    );

                }
            );

    }


    /*
     * ==================================================
     * APPROVE DEPOSIT
     * ==================================================
     */

    async function approveDeposit(
        depositId,
        button
    ) {

        const confirmed =
            confirm(
                "Approve this deposit? The customer's balance will be increased by the deposit amount."
            );


        if (!confirmed) {
            return;
        }


        button.disabled = true;
        button.textContent =
            "Approving...";


        try {

            const depositRef =
                doc(
                    db,
                    "deposits",
                    depositId
                );


            await runTransaction(
                db,
                async (transaction) => {

                    const depositSnap =
                        await transaction.get(
                            depositRef
                        );


                    if (
                        !depositSnap.exists()
                    ) {

                        throw new Error(
                            "Deposit no longer exists."
                        );

                    }


                    const deposit =
                        depositSnap.data();


                    if (
                        deposit.status !==
                        "pending"
                    ) {

                        throw new Error(
                            "This deposit has already been processed."
                        );

                    }


                    const amount =
                        Number(
                            deposit.amount
                        ) || 0;


                    if (
                        amount <= 0
                    ) {

                        throw new Error(
                            "Invalid deposit amount."
                        );

                    }


                    const customerUID =
                        deposit.customerUID ||
                        deposit.customerUid ||
                        deposit.userId ||
                        deposit.uid;


                    if (
                        !customerUID
                    ) {

                        throw new Error(
                            "Customer UID is missing from this deposit."
                        );

                    }


                    /*
                     * Your customer balance document
                     * is expected to be:
                     *
                     * users/{customerUID}
                     *
                     * with a numeric "balance" field.
                     */

                    const userRef =
                        doc(
                            db,
                            "users",
                            customerUID
                        );


                    const userSnap =
                        await transaction.get(
                            userRef
                        );


                    if (
                        !userSnap.exists()
                    ) {

                        throw new Error(
                            "Customer account was not found."
                        );

                    }


                    transaction.update(
                        userRef,
                        {
                            balance:
                                increment(
                                    amount
                                )
                        }
                    );


                    transaction.update(
                        depositRef,
                        {
                            status:
                                "approved",

                            approvedAt:
                                new Date(),

                            approvedBy:
                                auth.currentUser?.uid ||
                                null
                        }
                    );

                }
            );


            showSuccess(
                "Deposit approved successfully."
            );


            await loadDeposits();

        } catch (error) {

            console.error(
                "Approve deposit error:",
                error
            );

            showError(
                error.message ||
                "Unable to approve deposit."
            );

            button.disabled = false;
            button.textContent =
                "✓ Approve";

        }

    }


    /*
     * ==================================================
     * REJECT DEPOSIT
     * ==================================================
     */

    async function rejectDeposit(
        depositId,
        button
    ) {

        const confirmed =
            confirm(
                "Reject this deposit?"
            );


        if (!confirmed) {
            return;
        }


        button.disabled = true;
        button.textContent =
            "Rejecting...";


        try {

            const depositRef =
                doc(
                    db,
                    "deposits",
                    depositId
                );


            const depositSnap =
                await getDoc(
                    depositRef
                );


            if (
                !depositSnap.exists()
            ) {

                throw new Error(
                    "Deposit no longer exists."
                );

            }


            const deposit =
                depositSnap.data();


            if (
                deposit.status !==
                "pending"
            ) {

                throw new Error(
                    "This deposit has already been processed."
                );

            }


            await updateDoc(
                depositRef,
                {
                    status:
                        "rejected",

                    rejectedAt:
                        new Date(),

                    rejectedBy:
                        auth.currentUser?.uid ||
                        null
                }
            );


            showSuccess(
                "Deposit rejected successfully."
            );


            await loadDeposits();

        } catch (error) {

            console.error(
                "Reject deposit error:",
                error
            );

            showError(
                error.message ||
                "Unable to reject deposit."
            );

            button.disabled = false;
            button.textContent =
                "✕ Reject";

        }

    }


    /*
     * ==================================================
     * REFRESH
     * ==================================================
     */

    document
        .getElementById(
            "refreshButton"
        )
        .addEventListener(
            "click",
            loadDeposits
        );


    /*
     * ==================================================
     * LOGOUT
     * ==================================================
     */

    document
        .getElementById(
            "logoutButton"
        )
        .addEventListener(
            "click",
            async () => {

                try {

                    await signOut(auth);

                    window.location.href =
                        "index.html";

                } catch (error) {

                    console.error(
                        "Logout error:",
                        error
                    );

                }

            }
        );

</script>

</body>

</html>
