<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Deposit Management | Fame Store Admin</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f6f8f7;
            color: #17201b;
            font-family: "DM Sans", sans-serif;
        }

        .admin-page {
            width: 94%;
            max-width: 1200px;
            margin: auto;
            padding: 25px 0 60px;
        }

        /* HEADER */

        .admin-header {
            background: #ffffff;
            border: 1px solid #e3e9e5;
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 20px;

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .admin-header h1 {
            margin: 0 0 5px;
            font-size: 25px;
        }

        .admin-header p {
            margin: 0;
            color: #6d7771;
            font-size: 13px;
        }

        .admin-badge {
            background: #e9f8ef;
            color: #078b42;
            padding: 10px 14px;
            border-radius: 9px;
            font-size: 12px;
            font-weight: 800;
            white-space: nowrap;
        }

        /* STATS */

        .deposit-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #ffffff;
            border: 1px solid #e3e9e5;
            border-radius: 15px;
            padding: 20px;
        }

        .stat-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #e9f8ef;
            color: #078b42;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 12px;
            font-size: 18px;
        }

        .stat-card h3 {
            margin: 0 0 3px;
            font-size: 24px;
        }

        .stat-card p {
            margin: 0;
            color: #6d7771;
            font-size: 12px;
        }

        /* DEPOSITS */

        .deposits-card {
            background: #ffffff;
            border: 1px solid #e3e9e5;
            border-radius: 18px;
            overflow: hidden;
        }

        .deposits-title {
            padding: 20px;
            border-bottom: 1px solid #e5eae7;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .deposits-title h2 {
            margin: 0;
            font-size: 18px;
        }

        .refresh-button {
            background: white;
            border: 1px solid #078b42;
            color: #078b42;

            padding: 9px 14px;
            border-radius: 8px;

            font-family: inherit;
            font-size: 12px;
            font-weight: 800;

            cursor: pointer;
        }

        .refresh-button:hover {
            background: #078b42;
            color: white;
        }

        .deposit-list {
            padding: 20px;
        }

        /* DEPOSIT ITEM */

        .deposit-item {
            border: 1px solid #e2e8e4;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 15px;
            background: #fff;
        }

        .deposit-item:last-child {
            margin-bottom: 0;
        }

        .deposit-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 18px;
        }

        .customer-info h3 {
            margin: 0 0 4px;
            font-size: 15px;
        }

        .customer-info p {
            margin: 0;
            color: #707a74;
            font-size: 12px;
            word-break: break-word;
        }

        /* STATUS */

        .status-badge {
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 800;
            white-space: nowrap;
        }

        .status-pending {
            background: #fff6df;
            color: #aa6800;
            border: 1px solid #f3d99c;
        }

        .status-approved {
            background: #e9f8ef;
            color: #078b42;
            border: 1px solid #b9e5c9;
        }

        .status-rejected {
            background: #fff0f0;
            color: #d62d2d;
            border: 1px solid #f0cccc;
        }

        /* DETAILS */

        .deposit-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 18px;
        }

        .detail-box {
            background: #f7faf8;
            border-radius: 9px;
            padding: 12px;
        }

        .detail-box small {
            display: block;
            color: #717b75;
            font-size: 10px;
            margin-bottom: 4px;
        }

        .detail-box strong {
            display: block;
            font-size: 12px;
            word-break: break-word;
        }

        /* ACTIONS */

        .deposit-actions {
            display: flex;
            gap: 10px;
        }

        .approve-button,
        .reject-button {
            border: none;
            border-radius: 8px;
            padding: 11px 16px;

            font-family: inherit;
            font-size: 12px;
            font-weight: 800;

            cursor: pointer;
        }

        .approve-button {
            background: #078b42;
            color: #fff;
        }

        .approve-button:hover {
            background: #056b33;
        }

        .reject-button {
            background: #fff0f0;
            color: #d62d2d;
            border: 1px solid #efcccc;
        }

        .reject-button:hover {
            background: #d62d2d;
            color: #fff;
        }

        .approve-button:disabled,
        .reject-button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        /* MESSAGES */

        .loading,
        .empty-message,
        .error-message {
            padding: 45px 20px;
            text-align: center;
            color: #6d7771;
            font-size: 13px;
        }

        .loading-icon,
        .empty-icon {
            display: block;
            font-size: 30px;
            margin-bottom: 10px;
        }

        .empty-icon {
            color: #078b42;
        }

        .error-message {
            color: #c62828;
        }

        /* FOOTER */

        .admin-footer {
            text-align: center;
            margin-top: 25px;
            color: #7b847f;
            font-size: 11px;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .admin-page {
                width: 94%;
                padding-top: 18px;
            }

            .admin-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .admin-header h1 {
                font-size: 21px;
            }

            .deposit-stats {
                grid-template-columns: 1fr;
            }

            .deposit-details {
                grid-template-columns: 1fr;
            }

            .deposit-top {
                flex-direction: column;
            }

            .deposit-actions {
                flex-direction: column;
            }

            .approve-button,
            .reject-button {
                width: 100%;
            }

            .deposits-title {
                align-items: flex-start;
                flex-direction: column;
            }

            .refresh-button {
                width: 100%;
            }
        }

    </style>
</head>


<body>

<main class="admin-page">


    <!-- ================= HEADER ================= -->

    <section class="admin-header">

        <div>

            <h1>
                Deposit Management
            </h1>

            <p>
                Review and manage Fame Store customer deposits.
            </p>

        </div>

        <div class="admin-badge">

            🛡️ Admin

        </div>

    </section>



    <!-- ================= STATS ================= -->

    <section class="deposit-stats">


        <div class="stat-card">

            <div class="stat-icon">
                ⏳
            </div>

            <h3 id="pendingCount">
                0
            </h3>

            <p>
                Pending Deposits
            </p>

        </div>



        <div class="stat-card">

            <div class="stat-icon">
                ✓
            </div>

            <h3 id="approvedCount">
                0
            </h3>

            <p>
                Approved Deposits
            </p>

        </div>



        <div class="stat-card">

            <div class="stat-icon">
                ₦
            </div>

            <h3 id="pendingAmount">
                ₦0.00
            </h3>

            <p>
                Pending Amount
            </p>

        </div>


    </section>



    <!-- ================= DEPOSIT LIST ================= -->

    <section class="deposits-card">


        <div class="deposits-title">

            <h2>
                Customer Deposit Requests
            </h2>

            <button
                type="button"
                class="refresh-button"
                id="refreshButton"
            >
                ↻ Refresh
            </button>

        </div>


        <div
            class="deposit-list"
            id="depositList"
        >

            <div class="loading">

                <span class="loading-icon">
                    ⏳
                </span>

                Loading deposits...

            </div>

        </div>


    </section>



    <div class="admin-footer">

        Fame Store Admin Panel

    </div>


</main>



<!-- ================= FIREBASE ================= -->

<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


    import {
        getAuth,
        onAuthStateChanged,
        signOut
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


    import {
        getFirestore,
        collection,
        getDocs,
        doc,
        runTransaction,
        updateDoc,
        query,
        orderBy,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


    /* ================================================
       FIREBASE CONFIG
    ================================================ */

    const firebaseConfig = {

        apiKey:
            "AIzaSyCnANua92lDErdMwoKQG3xN4NtILIcyrsk",

        authDomain:
            "famestore-aaa70.firebaseapp.com",

        projectId:
            "famestore-aaa70",

        storageBucket:
            "famestore-aaa70.firebasestorage.app",

        messagingSenderId:
            "906739139078",

        appId:
            "1:906739139078:web:435561274e65d47eb33987",

        measurementId:
            "G-H2429058CT"

    };


    /* ================================================
       FIREBASE INITIALIZE
    ================================================ */

    const app =
        initializeApp(firebaseConfig);


    const auth =
        getAuth(app);


    const db =
        getFirestore(app);


    /* ================================================
       ADMIN EMAIL
    ================================================ */

    const ADMIN_EMAIL =
        "famesupport365@gmail.com";


    /* ================================================
       ELEMENTS
    ================================================ */

    const depositList =
        document.getElementById(
            "depositList"
        );


    const pendingCount =
        document.getElementById(
            "pendingCount"
        );


    const approvedCount =
        document.getElementById(
            "approvedCount"
        );


    const pendingAmount =
        document.getElementById(
            "pendingAmount"
        );


    const refreshButton =
        document.getElementById(
            "refreshButton"
        );


    /* ================================================
       FORMAT NAIRA
    ================================================ */

    function formatNaira(amount) {

        return "₦" +
            Number(amount || 0)
                .toLocaleString(
                    "en-NG",
                    {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    }
                );

    }


    /* ================================================
       ESCAPE HTML
    ================================================ */

    function escapeHtml(value) {

        return String(
            value ?? ""
        )
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* ================================================
       FORMAT DATE
    ================================================ */

    function formatDate(timestamp) {

        if (!timestamp) {
            return "Date unavailable";
        }

        try {

            if (
                typeof timestamp.toDate ===
                "function"
            ) {

                return timestamp
                    .toDate()
                    .toLocaleString(
                        "en-NG",
                        {
                            dateStyle: "medium",
                            timeStyle: "short"
                        }
                    );

            }

            return "Date unavailable";

        } catch {

            return "Date unavailable";

        }

    }


    /* ================================================
       AUTHENTICATION
    ================================================ */

    onAuthStateChanged(
        auth,
        async (user) => {

            /* --------------------------------
               NOT LOGGED IN
            -------------------------------- */

            if (!user) {

                window.location.href =
                    "login.html";

                return;

            }


            console.log(
                "Current login:",
                user.email
            );


            /* --------------------------------
               ADMIN EMAIL CHECK
            -------------------------------- */

            if (
                !user.email ||
                user.email.toLowerCase() !==
                ADMIN_EMAIL.toLowerCase()
            ) {

                alert(
                    "Access denied.\n\n" +
                    "Please login using the Fame Store admin account."
                );


                await signOut(auth);


                window.location.href =
                    "login.html";

                return;

            }


            /* --------------------------------
               ADMIN VERIFIED
            -------------------------------- */

            console.log(
                "Fame Store admin verified."
            );


            loadDeposits();

        }
    );


    /* ================================================
       LOAD DEPOSITS
    ================================================ */

    async function loadDeposits() {

        depositList.innerHTML = `

            <div class="loading">

                <span class="loading-icon">
                    ⏳
                </span>

                Loading deposits...

            </div>

        `;


        try {

            const depositsRef =
                collection(
                    db,
                    "deposits"
                );


            let snapshot;


            /* --------------------------------
               TRY ORDERED QUERY
            -------------------------------- */

            try {

                const depositsQuery =
                    query(
                        depositsRef,
                        orderBy(
                            "createdAt",
                            "desc"
                        )
                    );


                snapshot =
                    await getDocs(
                        depositsQuery
                    );

            } catch (error) {

                console.warn(
                    "Ordered query failed. Loading without order.",
                    error
                );


                snapshot =
                    await getDocs(
                        depositsRef
                    );

            }


            /* --------------------------------
               STAT VARIABLES
            -------------------------------- */

            let pending =
                0;

            let approved =
                0;

            let pendingTotal =
                0;


            /* --------------------------------
               EMPTY
            -------------------------------- */

            if (snapshot.empty) {

                depositList.innerHTML = `

                    <div class="empty-message">

                        <span class="empty-icon">
                            📥
                        </span>

                        No deposit requests yet.

                    </div>

                `;


                updateStats(
                    0,
                    0,
                    0
                );


                return;

            }


            depositList.innerHTML = "";


            /* --------------------------------
               PROCESS DEPOSITS
            -------------------------------- */

            snapshot.forEach(
                (depositDoc) => {

                    const data =
                        depositDoc.data();


                    const depositId =
                        depositDoc.id;


                    const status =
                        String(
                            data.status ||
                            "pending"
                        ).toLowerCase();


                    const amount =
                        Number(
                            data.amount || 0
                        );


                    /* --------------------------------
                       STATS
                    -------------------------------- */

                    if (
                        status ===
                        "pending"
                    ) {

                        pending++;

                        pendingTotal +=
                            amount;

                    }


                    if (
                        status ===
                        "approved"
                    ) {

                        approved++;

                    }


                    /* --------------------------------
                       CUSTOMER INFORMATION
                    -------------------------------- */

                    const customerEmail =
                        data.customerEmail ||
                        data.email ||
                        "No email";


                    const customerName =
                        data.fullName ||
                        data.customerName ||
                        customerEmail;


                    const senderName =
                        data.senderName ||
                        "Not provided";


                    const transactionReference =
                        data.transactionReference ||
                        "Not provided";


                    const userId =
                        data.userId ||
                        "";


                    /* --------------------------------
                       STATUS CLASS
                    -------------------------------- */

                    let statusClass =
                        "status-pending";


                    if (
                        status ===
                        "approved"
                    ) {

                        statusClass =
                            "status-approved";

                    }


                    if (
                        status ===
                        "rejected"
                    ) {

                        statusClass =
                            "status-rejected";

                    }


                    /* --------------------------------
                       CREATE ITEM
                    -------------------------------- */

                    const item =
                        document.createElement(
                            "div"
                        );


                    item.className =
                        "deposit-item";


                    item.innerHTML = `

                        <div class="deposit-top">

                            <div class="customer-info">

                                <h3>
                                    ${escapeHtml(
                                        customerEmail
                                    )}
                                </h3>

                                <p>
                                    ${escapeHtml(
                                        customerName
                                    )}
                                </p>

                            </div>


                            <span
                                class="status-badge ${statusClass}"
                            >

                                ${escapeHtml(
                                    status.toUpperCase()
                                )}

                            </span>

                        </div>


                        <div class="deposit-details">


                            <div class="detail-box">

                                <small>
                                    Deposit Amount
                                </small>

                                <strong>
                                    ${formatNaira(
                                        amount
                                    )}
                                </strong>

                            </div>


                            <div class="detail-box">

                                <small>
                                    Sender Name
                                </small>

                                <strong>
                                    ${escapeHtml(
                                        senderName
                                    )}
                                </strong>

                            </div>


                            <div class="detail-box">

                                <small>
                                    Transaction Reference
                                </small>

                                <strong>
                                    ${escapeHtml(
                                        transactionReference
                                    )}
                                </strong>

                            </div>


                            <div class="detail-box">

                                <small>
                                    Submitted
                                </small>

                                <strong>
                                    ${formatDate(
                                        data.createdAt
                                    )}
                                </strong>

                            </div>


                            <div class="detail-box">

                                <small>
                                    Customer UID
                                </small>

                                <strong>
                                    ${escapeHtml(
                                        userId
                                    )}
                                </strong>

                            </div>


                        </div>


                        ${
                            status ===
                            "pending"
                            ?
                            `

                                <div class="deposit-actions">

                                    <button
                                        type="button"
                                        class="approve-button"
                                        data-id="${escapeHtml(
                                            depositId
                                        )}"
                                    >

                                        ✓
                                        Approve Payment

                                    </button>


                                    <button
                                        type="button"
                                        class="reject-button"
                                        data-id="${escapeHtml(
                                            depositId
                                        )}"
                                    >

                                        ✕
                                        Reject

                                    </button>

                                </div>

                            `
                            :
                            ""
                        }

                    `;


                    depositList.appendChild(
                        item
                    );

                }
            );


            updateStats(
                pending,
                approved,
                pendingTotal
            );


            attachActions();


        } catch (error) {

            console.error(
                "LOAD DEPOSITS ERROR:",
                error
            );


            depositList.innerHTML = `

                <div class="error-message">

                    Unable to load deposits.

                    <br><br>

                    ${escapeHtml(
                        error.message
                    )}

                </div>

            `;

        }

    }


    /* ================================================
       UPDATE STATS
    ================================================ */

    function updateStats(
        pending,
        approved,
        amount
    ) {

        pendingCount.textContent =
            pending;


        approvedCount.textContent =
            approved;


        pendingAmount.textContent =
            formatNaira(
                amount
            );

    }


    /* ================================================
       ATTACH BUTTON ACTIONS
    ================================================ */

    function attachActions() {


        document
            .querySelectorAll(
                ".approve-button"
            )
            .forEach(
                (button) => {

                    button.addEventListener(
                        "click",
                        () => {

                            approveDeposit(
                                button.dataset.id,
                                button
                            );

                        }
                    );

                }
            );


        document
            .querySelectorAll(
                ".reject-button"
            )
            .forEach(
                (button) => {

                    button.addEventListener(
                        "click",
                        () => {

                            rejectDeposit(
                                button.dataset.id,
                                button
                            );

                        }
                    );

                }
            );

    }


    /* ================================================
       APPROVE DEPOSIT
    ================================================ */

    async function approveDeposit(
        depositId,
        button
    ) {

        const confirmed =
            confirm(
                "Approve this payment?\n\n" +
                "The deposit amount will be added to the customer's wallet."
            );


        if (!confirmed) {
            return;
        }


        button.disabled =
            true;


        button.textContent =
            "Approving...";


        try {

            const depositRef =
                doc(
                    db,
                    "deposits",
                    depositId
                );


            await runTransaction(
                db,
                async (transaction) => {

                    /* --------------------------------
                       GET DEPOSIT
                    -------------------------------- */

                    const depositSnapshot =
                        await transaction.get(
                            depositRef
                        );


                    if (
                        !depositSnapshot.exists()
                    ) {

                        throw new Error(
                            "Deposit request was not found."
                        );

                    }


                    const depositData =
                        depositSnapshot.data();


                    /* --------------------------------
                       CHECK STATUS
                    -------------------------------- */

                    const currentStatus =
                        String(
                            depositData.status ||
                            "pending"
                        ).toLowerCase();


                    if (
                        currentStatus ===
                        "approved"
                    ) {

                        throw new Error(
                            "This deposit has already been approved."
                        );

                    }


                    if (
                        currentStatus ===
                        "rejected"
                    ) {

                        throw new Error(
                            "This deposit has already been rejected."
                        );

                    }


                    /* --------------------------------
                       CUSTOMER UID
                    -------------------------------- */

                    const userId =
                        depositData.userId;


                    if (!userId) {

                        throw new Error(
                            "Customer UID is missing from this deposit."
                        );

                    }


                    /* --------------------------------
                       AMOUNT
                    -------------------------------- */

                    const amount =
                        Number(
                            depositData.amount ||
                            0
                        );


                    if (
                        !Number.isFinite(
                            amount
                        ) ||
                        amount <= 0
                    ) {

                        throw new Error(
                            "Invalid deposit amount."
                        );

                    }


                    /* --------------------------------
                       CUSTOMER DOCUMENT
                    -------------------------------- */

                    const userRef =
                        doc(
                            db,
                            "users",
                            userId
                        );


                    const userSnapshot =
                        await transaction.get(
                            userRef
                        );


                    /* --------------------------------
                       EXISTING CUSTOMER
                    -------------------------------- */

                    if (
                        userSnapshot.exists()
                    ) {

                        const userData =
                            userSnapshot.data();


                        const oldBalance =
                            Number(
                                userData.walletBalance ||
                                0
                            );


                        const newBalance =
                            oldBalance +
                            amount;


                        transaction.update(
                            userRef,
                            {

                                walletBalance:
                                    newBalance

                            }
                        );

                    }


                    /* --------------------------------
                       CUSTOMER DOCUMENT MISSING
                    -------------------------------- */

                    else {

                        transaction.set(
                            userRef,
                            {

                                uid:
                                    userId,

                                email:
                                    depositData.customerEmail ||
                                    "",

                                fullName:
                                    depositData.fullName ||
                                    depositData.customerName ||
                                    "Customer",

                                walletBalance:
                                    amount,

                                createdAt:
                                    serverTimestamp()

                            }
                        );

                    }


                    /* --------------------------------
                       MARK DEPOSIT APPROVED
                    -------------------------------- */

                    transaction.update(
                        depositRef,
                        {

                            status:
                                "approved",

                            approvedBy:
                                ADMIN_EMAIL,

                            approvedAt:
                                serverTimestamp(),

                            creditedAmount:
                                amount,

                            walletCredited:
                                true

                        }
                    );

                }
            );


            alert(
                "Payment approved successfully.\n\n" +
                formatNaira(
                    Number(
                        "0"
                    )
                ).replace(
                    "₦0.00",
                    ""
                ) +
                "The customer's wallet has been credited."
            );


            await loadDeposits();


        } catch (error) {

            console.error(
                "APPROVE ERROR:",
                error
            );


            alert(
                "Unable to approve payment.\n\n" +
                error.message
            );


            button.disabled =
                false;


            button.textContent =
                "✓ Approve Payment";

        }

    }


    /* ================================================
       REJECT DEPOSIT
    ================================================ */

    async function rejectDeposit(
        depositId,
        button
    ) {

        const confirmed =
            confirm(
                "Reject this deposit payment?"
            );


        if (!confirmed) {
            return;
        }


        button.disabled =
            true;


        button.textContent =
            "Rejecting...";


        try {

            const depositRef =
                doc(
                    db,
                    "deposits",
                    depositId
                );


            await runTransaction(
                db,
                async (transaction) => {

                    const depositSnapshot =
                        await transaction.get(
                            depositRef
                        );


                    if (
                        !depositSnapshot.exists()
                    ) {

                        throw new Error(
                            "Deposit request was not found."
                        );

                    }


                    const depositData =
                        depositSnapshot.data();


                    const currentStatus =
                        String(
                            depositData.status ||
                            "pending"
                        ).toLowerCase();


                    if (
                        currentStatus ===
                        "approved"
                    ) {

                        throw new Error(
                            "This deposit has already been approved."
                        );

                    }


                    if (
                        currentStatus ===
                        "rejected"
                    ) {

                        throw new Error(
                            "This deposit has already been rejected."
                        );

                    }


                    transaction.update(
                        depositRef,
                        {

                            status:
                                "rejected",

                            rejectedBy:
                                ADMIN_EMAIL,

                            rejectedAt:
                                serverTimestamp(),

                            walletCredited:
                                false

                        }
                    );

                }
            );


            alert(
                "Deposit rejected successfully."
            );


            await loadDeposits();


        } catch (error) {

            console.error(
                "REJECT ERROR:",
                error
            );


            alert(
                "Unable to reject deposit.\n\n" +
                error.message
            );


            button.disabled =
                false;


            button.textContent =
                "✕ Reject";

        }

    }


    /* ================================================
       REFRESH
    ================================================ */

    refreshButton.addEventListener(
        "click",
        () => {

            loadDeposits();

        }
    );

</script>
