<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Deposit Management | Fame Store</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f6f8f7;
            font-family: "DM Sans", sans-serif;
            color: #17201b;
        }

        .admin-page {
            width: 92%;
            max-width: 1200px;
            margin: auto;
            padding: 30px 0 60px;
        }

        .admin-header {
            background: #fff;
            border: 1px solid #e5ebe7;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .admin-header h1 {
            margin: 0 0 5px;
            font-size: 25px;
        }

        .admin-header p {
            margin: 0;
            color: #69736d;
            font-size: 13px;
        }

        .admin-badge {
            background: #e9f8ef;
            color: #078b43;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 800;
        }

        .admin-email {
            display: block;
            margin-top: 4px;
            color: #69736d;
            font-size: 11px;
            font-weight: 500;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat {
            background: #fff;
            border: 1px solid #e5ebe7;
            border-radius: 14px;
            padding: 20px;
        }

        .stat-title {
            color: #69736d;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .stat-number {
            font-size: 25px;
            font-weight: 800;
        }

        .pending {
            color: #b56a00;
        }

        .approved {
            color: #078b43;
        }

        .amount {
            color: #17201b;
        }

        .deposit-card {
            background: #fff;
            border: 1px solid #e5ebe7;
            border-radius: 16px;
            overflow: hidden;
        }

        .card-header {
            padding: 20px;
            border-bottom: 1px solid #e5ebe7;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .card-header h2 {
            margin: 0;
            font-size: 18px;
        }

        .refresh-btn {
            border: 1px solid #078b43;
            background: #fff;
            color: #078b43;
            border-radius: 7px;
            padding: 9px 14px;
            font-weight: 800;
            cursor: pointer;
        }

        .refresh-btn:hover {
            background: #078b43;
            color: #fff;
        }

        .deposit-list {
            padding: 20px;
        }

        .deposit-item {
            border: 1px solid #e5ebe7;
            border-radius: 13px;
            padding: 18px;
            margin-bottom: 15px;
        }

        .deposit-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 18px;
        }

        .customer-email {
            font-size: 15px;
            font-weight: 800;
            word-break: break-word;
        }

        .customer-uid {
            color: #78827c;
            font-size: 10px;
            margin-top: 5px;
            word-break: break-all;
        }

        .status {
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 800;
        }

        .status-pending {
            background: #fff6df;
            color: #ad6900;
            border: 1px solid #ffe0a3;
        }

        .status-approved {
            background: #e9f8ef;
            color: #078b43;
            border: 1px solid #bce8cc;
        }

        .status-rejected {
            background: #fff0f0;
            color: #d93025;
            border: 1px solid #f0cccc;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 18px;
        }

        .detail {
            background: #f7faf8;
            padding: 12px;
            border-radius: 8px;
        }

        .detail small {
            display: block;
            color: #758079;
            font-size: 10px;
            margin-bottom: 4px;
        }

        .detail strong {
            font-size: 13px;
            word-break: break-word;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .approve,
        .reject {
            border: none;
            border-radius: 7px;
            padding: 11px 16px;
            font-family: inherit;
            font-weight: 800;
            cursor: pointer;
        }

        .approve {
            background: #078b43;
            color: #fff;
        }

        .approve:hover {
            background: #056b34;
        }

        .reject {
            background: #fff0f0;
            color: #d93025;
            border: 1px solid #f0cccc;
        }

        .reject:hover {
            background: #d93025;
            color: #fff;
        }

        .loading,
        .empty,
        .error {
            text-align: center;
            padding: 40px 20px;
            color: #69736d;
            font-size: 13px;
        }

        .error {
            color: #d93025;
        }

        .footer {
            text-align: center;
            color: #78827c;
            font-size: 11px;
            margin-top: 25px;
        }

        @media (max-width: 700px) {

            .admin-page {
                width: 94%;
                padding-top: 20px;
            }

            .admin-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .details {
                grid-template-columns: 1fr;
            }

            .deposit-top {
                flex-direction: column;
            }

            .actions {
                flex-direction: column;
            }

            .approve,
            .reject {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<main class="admin-page">

    <section class="admin-header">

        <div>
            <h1>Deposit Management</h1>

            <p>
                Review Fame Store customer deposit requests.
            </p>

            <span class="admin-email">
                Logged in as: famesupport365@gmail.com
            </span>
        </div>

        <div class="admin-badge">
            🛡️ ADMIN
        </div>

    </section>


    <section class="stats">

        <div class="stat">

            <div class="stat-title">
                Pending Deposits
            </div>

            <div
                class="stat-number pending"
                id="pendingCount"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                Approved Deposits
            </div>

            <div
                class="stat-number approved"
                id="approvedCount"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                Pending Amount
            </div>

            <div
                class="stat-number amount"
                id="pendingAmount"
            >
                ₦0.00
            </div>

        </div>

    </section>


    <section class="deposit-card">

        <div class="card-header">

            <h2>
                Customer Deposit Requests
            </h2>

            <button
                class="refresh-btn"
                id="refreshBtn"
            >
                ↻ Refresh
            </button>

        </div>


        <div
            class="deposit-list"
            id="depositList"
        >

            <div class="loading">
                Loading deposits...
            </div>

        </div>

    </section>


    <div class="footer">
        © 2026 Fame Store Admin Panel
    </div>

</main>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

import {
    getFirestore,
    collection,
    getDocs,
    doc,
    runTransaction,
    updateDoc,
    serverTimestamp,
    query,
    orderBy
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyCnANua92lDErdMwoKQG3xN4NtILIcyrsk",

    authDomain:
        "famestore-aaa70.firebaseapp.com",

    projectId:
        "famestore-aaa70",

    storageBucket:
        "famestore-aaa70.firebasestorage.app",

    messagingSenderId:
        "906739139078",

    appId:
        "1:906739139078:web:435561274e65d47eb33987",

    measurementId:
        "G-H2429058CT"

};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* =====================================================
   ADMIN EMAIL
===================================================== */

const ADMIN_EMAIL =
    "famesupport365@gmail.com";


/* =====================================================
   ELEMENTS
===================================================== */

const depositList =
    document.getElementById("depositList");

const pendingCount =
    document.getElementById("pendingCount");

const approvedCount =
    document.getElementById("approvedCount");

const pendingAmount =
    document.getElementById("pendingAmount");


/* =====================================================
   FORMAT NAIRA
===================================================== */

function formatNaira(amount) {

    return "₦" +
        Number(amount || 0).toLocaleString(
            "en-NG",
            {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }
        );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(timestamp) {

    if (!timestamp) {
        return "Date unavailable";
    }

    try {

        if (
            typeof timestamp.toDate ===
            "function"
        ) {

            return timestamp
                .toDate()
                .toLocaleString(
                    "en-NG",
                    {
                        dateStyle: "medium",
                        timeStyle: "short"
                    }
                );

        }

        return "Date unavailable";

    } catch {

        return "Date unavailable";

    }

}


/* =====================================================
   ADMIN AUTHENTICATION
===================================================== */

onAuthStateChanged(
    auth,
    async (user) => {

        if (!user) {

            window.location.href =
                "login.html";

            return;

        }


        console.log(
            "Current user:",
            user.email
        );


        if (
            !user.email ||
            user.email.toLowerCase() !==
            ADMIN_EMAIL.toLowerCase()
        ) {

            alert(
                "Access denied. Login with the Fame Store admin account."
            );

            await signOut(auth);

            window.location.href =
                "login.html";

            return;

        }


        await loadDeposits();

    }
);


/* =====================================================
   LOAD DEPOSITS
===================================================== */

async function loadDeposits() {

    depositList.innerHTML = `
        <div class="loading">
            Loading deposits...
        </div>
    `;


    try {

        const depositsRef =
            collection(
                db,
                "deposits"
            );


        let snapshot;


        try {

            const depositsQuery =
                query(
                    depositsRef,
                    orderBy(
                        "createdAt",
                        "desc"
                    )
                );


            snapshot =
                await getDocs(
                    depositsQuery
                );

        } catch (error) {

            console.warn(
                "Ordered query failed:",
                error
            );


            snapshot =
                await getDocs(
                    depositsRef
                );

        }


        let pending = 0;
        let approved = 0;
        let amount = 0;


        if (snapshot.empty) {

            depositList.innerHTML = `
                <div class="empty">
                    No deposit requests found.
                </div>
            `;

            updateStats(
                0,
                0,
                0
            );

            return;

        }


        depositList.innerHTML = "";


        snapshot.forEach(
            (depositDoc) => {

                const data =
                    depositDoc.data();


                const depositId =
                    depositDoc.id;


                const status =
                    String(
                        data.status ||
                        "pending"
                    ).toLowerCase();


                const depositAmount =
                    Number(
                        data.amount || 0
                    );


                if (
                    status ===
                    "pending"
                ) {

                    pending++;

                    amount +=
                        depositAmount;

                }


                if (
                    status ===
                    "approved"
                ) {

                    approved++;

                }


                const email =
                    data.customerEmail ||
                    "No email";


                const sender =
                    data.senderName ||
                    "Not provided";


                const reference =
                    data.transactionReference ||
                    "Not provided";


                const uid =
                    data.userId ||
                    "Missing UID";


                const bankName =
                    data.bankName ||
                    "Not provided";


                const accountNumber =
                    data.accountNumber ||
                    "Not provided";


                let statusClass =
                    "status-pending";


                if (
                    status ===
                    "approved"
                ) {

                    statusClass =
                        "status-approved";

                }


                if (
                    status ===
                    "rejected"
                ) {

                    statusClass =
                        "status-rejected";

                }


                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "deposit-item";


                item.innerHTML = `

                    <div class="deposit-top">

                        <div>

                            <div class="customer-email">

                                ${escapeHtml(email)}

                            </div>

                            <div class="customer-uid">

                                Customer UID:
                                ${escapeHtml(uid)}

                            </div>

                        </div>


                        <span
                            class="status ${statusClass}"
                        >

                            ${escapeHtml(
                                status.toUpperCase()
                            )}

                        </span>

                    </div>


                    <div class="details">

                        <div class="detail">

                            <small>
                                Deposit Amount
                            </small>

                            <strong>
                                ${formatNaira(
                                    depositAmount
                                )}
                            </strong>

                        </div>


                        <div class="detail">

                            <small>
                                Sender Name
                            </small>

                            <strong>
                                ${escapeHtml(
                                    sender
                                )}
                            </strong>

                        </div>


                        <div class="detail">

                            <small>
                                Transaction Reference
                            </small>

                            <strong>
                                ${escapeHtml(
                                    reference
                                )}
                            </strong>

                        </div>


                        <div class="detail">

                            <small>
                                Bank
                            </small>

                            <strong>
                                ${escapeHtml(
                                    bankName
                                )}
                            </strong>

                        </div>


                        <div class="detail">

                            <small>
                                Account Number
                            </small>

                            <strong>
                                ${escapeHtml(
                                    accountNumber
                                )}
                            </strong>

                        </div>


                        <div class="detail">

                            <small>
                                Submitted
                            </small>

                            <strong>
                                ${formatDate(
                                    data.createdAt
                                )}
                            </strong>

                        </div>

                    </div>


                    ${
                        status === "pending"
                        ?
                        `

                        <div class="actions">

                            <button
                                class="approve"
                                data-id="${escapeHtml(
                                    depositId
                                )}"
                            >
                                ✓ Approve Payment
                            </button>


                            <button
                                class="reject"
                                data-id="${escapeHtml(
                                    depositId
                                )}"
                            >
                                ✕ Reject
                            </button>

                        </div>

                        `
                        :
                        ""
                    }

                `;


                depositList.appendChild(
                    item
                );

            }
        );


        updateStats(
            pending,
            approved,
            amount
        );


        attachButtons();


    } catch (error) {

        console.error(
            "LOAD DEPOSITS ERROR:",
            error
        );


        depositList.innerHTML = `

            <div class="error">

                Unable to load deposits.

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

    }

}


/* =====================================================
   STATS
===================================================== */

function updateStats(
    pending,
    approved,
    amount
) {

    pendingCount.textContent =
        pending;

    approvedCount.textContent =
        approved;

    pendingAmount.textContent =
        formatNaira(amount);

}


/* =====================================================
   BUTTONS
===================================================== */

function attachButtons() {

    document
        .querySelectorAll(
            ".approve"
        )
        .forEach(
            (button) => {

                button.addEventListener(
                    "click",
                    () => {

                        approveDeposit(
                            button.dataset.id
                        );

                    }
                );

            }
        );


    document
        .querySelectorAll(
            ".reject"
        )
        .forEach(
            (button) => {

                button.addEventListener(
                    "click",
                    () => {

                        rejectDeposit(
                            button.dataset.id
                        );

                    }
                );

            }
        );

}


/* =====================================================
   APPROVE DEPOSIT
===================================================== */

async function approveDeposit(
    depositId
) {

    const confirmed =
        confirm(
            "Approve this deposit and credit the customer's wallet?"
        );


    if (!confirmed) {
        return;
    }


    try {

        const depositRef =
            doc(
                db,
                "deposits",
                depositId
            );


        await runTransaction(
            db,
            async (transaction) => {

                /* GET DEPOSIT */

                const depositSnapshot =
                    await transaction.get(
                        depositRef
                    );


                if (
                    !depositSnapshot.exists()
                ) {

                    throw new Error(
                        "Deposit does not exist."
                    );

                }


                const depositData =
                    depositSnapshot.data();


                /* PREVENT DOUBLE CREDIT */

                const currentStatus =
                    String(
                        depositData.status ||
                        "pending"
                    ).toLowerCase();


                if (
                    currentStatus ===
                    "approved"
                ) {

                    throw new Error(
                        "This deposit is already approved."
                    );

                }


                if (
                    currentStatus ===
                    "rejected"
                ) {

                    throw new Error(
                        "This deposit has already been rejected."
                    );

                }


                /* USER UID */

                const userId =
                    depositData.userId;


                if (!userId) {

                    throw new Error(
                        "Customer UID is missing."
                    );

                }


                /* AMOUNT */

                const depositAmount =
                    Number(
                        depositData.amount || 0
                    );


                if (
                    !Number.isFinite(
                        depositAmount
                    ) ||
                    depositAmount <= 0
                ) {

                    throw new Error(
                        "Invalid deposit amount."
                    );

                }


                /* CUSTOMER DOCUMENT */

                const userRef =
                    doc(
                        db,
                        "users",
                        userId
                    );


                const userSnapshot =
                    await transaction.get(
                        userRef
                    );


                if (
                    userSnapshot.exists()
                ) {

                    const userData =
                        userSnapshot.data();


                    const currentBalance =
                        Number(
                            userData.walletBalance ||
                            0
                        );


                    const newBalance =
                        currentBalance +
                        depositAmount;


                    transaction.update(
                        userRef,
                        {

                            walletBalance:
                                newBalance

                        }
                    );

                } else {

                    transaction.set(
                        userRef,
                        {

                            uid:
                                userId,

                            email:
                                depositData.customerEmail ||
                                "",

                            walletBalance:
                                depositAmount,

                            createdAt:
                                serverTimestamp()

                        }
                    );

                }


                /* MARK APPROVED */

                transaction.update(
                    depositRef,
                    {

                        status:
                            "approved",

                        approvedBy:
                            ADMIN_EMAIL,

                        approvedAt:
                            serverTimestamp(),

                        creditedAmount:
                            depositAmount,

                        walletCredited:
                            true

                    }
                );

            }
        );


        alert(
            "Payment approved successfully.\n\n" +
            "Customer wallet has been credited."
        );


        await loadDeposits();


    } catch (error) {

        console.error(
            "APPROVE ERROR:",
            error
        );


        alert(
            "Unable to approve payment.\n\n" +
            error.message
        );

    }

}


/* =====================================================
   REJECT DEPOSIT
===================================================== */

async function rejectDeposit(
    depositId
) {

    const confirmed =
        confirm(
            "Reject this deposit?"
        );


    if (!confirmed) {
        return;
    }


    try {

        const depositRef =
            doc(
                db,
                "deposits",
                depositId
            );


        await updateDoc(
            depositRef,
            {

                status:
                    "rejected",

                rejectedBy:
                    ADMIN_EMAIL,

                rejectedAt:
                    serverTimestamp()

            }
        );


        alert(
            "Deposit rejected."
        );


        await loadDeposits();


    } catch (error) {

        console.error(
            "REJECT ERROR:",
            error
        );


        alert(
            "Unable to reject deposit.\n\n" +
            error.message
        );

    }

}


/* =====================================================
   REFRESH
===================================================== */

document
    .getElementById(
        "refreshBtn"
    )
    .addEventListener(
        "click",
        loadDeposits
    );

</script>

</body>
</html>
