<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Fame Store</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >
</head>

<body class="auth-page">

    <div class="auth-container">

        <!-- LOGO -->

        <a href="index.html" class="auth-logo">

            <span class="logo-icon">🛍️</span>

            <div>
                <strong>Fame <span>Store</span></strong>
                <small>Send gifts 🎁, share love</small>
            </div>

        </a>


        <!-- LOGIN CARD -->

        <div class="auth-card">

            <div class="auth-header">

                <h1>Welcome Back</h1>

                <p>
                    Login to your Fame Store account
                </p>

            </div>


            <form id="loginForm">

                <!-- GMAIL -->

                <div class="form-group">

                    <label for="email">
                        Gmail
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your Gmail address"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- LOGIN OPTIONS -->

                <div class="login-options">

                    <label>

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        Remember me

                    </label>


                    <a href="forgot-password.html">
                        Forgot Password?
                    </a>

                </div>


                <!-- MESSAGE -->

                <div id="loginMessage"></div>


                <!-- LOGIN -->

                <button
                    type="submit"
                    class="btn btn-primary auth-button"
                    id="loginButton"
                >
                    Login Account
                </button>

            </form>


            <!-- REGISTER -->

            <div class="auth-footer">

                <p>
                    Don't have an account?
                    <a href="register.html">
                        Create Account
                    </a>
                </p>

            </div>

        </div>


        <a href="index.html" class="back-home">
            ← Back to Fame Store
        </a>

    </div>


    <!-- FIREBASE -->

    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


        import {
            getAuth,
            signInWithEmailAndPassword,
            setPersistence,
            browserLocalPersistence,
            browserSessionPersistence
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


        const firebaseConfig = {

            apiKey: "AIzaSyCnANua92lDErdMwoKQG3xN4NtILIcyrsk",

            authDomain: "famestore-aaa70.firebaseapp.com",

            projectId: "famestore-aaa70",

            storageBucket: "famestore-aaa70.firebasestorage.app",

            messagingSenderId: "906739139078",

            appId: "1:906739139078:web:435561274e65d47eb33987",

            measurementId: "G-H2429058CT"

        };


        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);


        const loginForm =
            document.getElementById("loginForm");

        const loginMessage =
            document.getElementById("loginMessage");

        const loginButton =
            document.getElementById("loginButton");

        const rememberMe =
            document.getElementById("rememberMe");


        function showMessage(message, type) {

            loginMessage.textContent = message;

            loginMessage.className = type;

        }


        loginForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;


                if (!email || !password) {

                    showMessage(
                        "Please enter your Gmail and password.",
                        "form-error"
                    );

                    return;
                }


                loginButton.disabled = true;

                loginButton.textContent =
                    "Logging In...";


                try {

                    const persistence =
                        rememberMe.checked
                            ? browserLocalPersistence
                            : browserSessionPersistence;


                    await setPersistence(
                        auth,
                        persistence
                    );


                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                    showMessage(
                        "Login successful!",
                        "form-success"
                    );


                    loginButton.textContent =
                        "Login Successful";


                    setTimeout(() => {

                        window.location.href =
                            "dashboard.html";

                    }, 800);


                } catch (error) {

                    console.error(error);


                    let message =
                        "Unable to login. Please try again.";


                    switch (error.code) {

                        case "auth/invalid-credential":

                            message =
                                "Incorrect Gmail or password.";

                            break;


                        case "auth/user-not-found":

                            message =
                                "No account was found with this Gmail.";

                            break;


                        case "auth/wrong-password":

                            message =
                                "Incorrect Gmail or password.";

                            break;


                        case "auth/invalid-email":

                            message =
                                "Please enter a valid Gmail address.";

                            break;


                        case "auth/too-many-requests":

                            message =
                                "Too many attempts. Please try again later.";

                            break;


                        case "auth/network-request-failed":

                            message =
                                "Network error. Please check your internet connection.";

                            break;

                    }


                    showMessage(
                        message,
                        "form-error"
                    );


                    loginButton.disabled = false;

                    loginButton.textContent =
                        "Login Account";

                }

            }
        );

    </script>

</body>
</html>
